<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Draftline — manage projects, editors, budgets, and tasks." />
    <title>Draftline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      THESIS: Draftline makes studio work legible at a glance instead of hiding it in stacked KPI cards.
      OWN-WORLD: Graphite canvas, warm paper panels, cobalt actions, amber money, and hairline dividers.
      STORY: The owner sees the week, understands the cash, then moves directly into clients, editor work, or tasks.
      FIRST VIEWPORT: Sidebar + command bar frame a live weekly pulse, money rail, and today’s delivery queue.
      FORM: Operate-mode split dashboard, chosen over a conventional marketing hero or card grid.
    -->
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span></div>
          <div><strong>Draftline</strong></div>
        </div>

        <p class="nav-label">Workspace</p>
        <nav class="nav-list">
          <button class="nav-item active" data-page="overview"><span class="nav-icon">◈</span> Overview</button>
          <button class="nav-item" data-page="projects"><span class="nav-icon">▦</span> Projects <b class="nav-count">8</b></button>
          <button class="nav-item" data-page="editor"><span class="nav-icon">◌</span> Editor desk</button>
          <button class="nav-item" data-page="tasks"><span class="nav-icon">✓</span> My tasks <b class="nav-count alert">4</b></button>
        </nav>

        <div class="sidebar-bottom">
          <button class="nav-item settings" data-page="settings"><span class="nav-icon">⚙</span> Settings</button>
          <div class="profile-row">
            <div class="profile-avatar">FA</div>
            <div><strong>Fahad</strong><small>Administrator</small></div>
            <button class="profile-switch" id="userSwitch" type="button">Switch</button>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="crumbs"><span>Workspace</span><span>/</span><strong id="breadcrumb">Overview</strong></div>
          <div class="top-actions">
            <button class="user-switch-top" id="userSwitchTop" type="button"><span class="profile-avatar">FA</span> Switch user</button>
            <button class="icon-button notification-button" aria-label="Notifications">♢<i></i></button>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"><span>☼</span><span class="toggle-knob"></span><span>☾</span></button>
          </div>
        </header>

        <div id="pageContent"></div>
      </main>
    </div>

    <div class="toast" id="toast" role="status"><span>✓</span><p>Saved</p></div>
    <dialog class="project-dialog" id="projectDialog">
      <form method="dialog" id="projectForm">
        <div class="dialog-header"><div><p class="eyebrow">Project details</p><h2>Add a project</h2></div><button type="submit" formnovalidate class="dialog-close" value="cancel" aria-label="Close">×</button></div>
        <label>Project name<input required name="name" placeholder="e.g. Paper plane launch" /></label>
        <label>Client<input required name="client" placeholder="e.g. Northstar Labs" /></label>
        <div class="form-grid"><label>Budget<input required name="budget" type="number" placeholder="2500" /></label><label>Due date<input required name="due" type="date" /></label></div>
        <div class="form-grid"><label>Voice-over link<input name="voiceover" type="url" placeholder="https://..." /></label><label>Script link<input name="script" type="url" placeholder="https://..." /></label></div>
        <label>Video link<input name="video" type="url" placeholder="https://..." /></label>
        <label>Instruction box<textarea name="instructions" rows="3" placeholder="A quick brief for your future self..."></textarea></label>
        <button class="primary-button full" value="default">Create project <span>→</span></button>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
